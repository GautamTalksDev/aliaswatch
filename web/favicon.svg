<!-- Favicon. Simplified for 16px: fewer ticks, heavier strokes, no baseline.
     A faithful shrink of the full mark turns to mud at tab size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="5" fill="#16191B"/>
  <g stroke="#F1F3EF" stroke-width="3" stroke-linecap="round" opacity=".8">
    <line x1="7"  y1="13" x2="7"  y2="19"/>
    <line x1="13" y1="11" x2="13" y2="21"/>
  </g>
  <line x1="20" y1="5" x2="20" y2="27" stroke="#E0705A" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#F1F3EF" stroke-width="3" stroke-linecap="round" opacity=".8">
    <line x1="26" y1="13" x2="26" y2="19"/>
  </g>
</svg>
